# ============================================================
# DT-QUEST Domain Config Template
# ============================================================
# Copy this folder, rename it, and fill in the values below
# to create a new domain plugin for DT-QUEST.
#
# Required sections: domain, parameters
# Optional sections: presets, consistency_rules, unit_detection,
#                    reference_models, readiness_weights
# ============================================================

domain:
  id: "my-domain"                  # unique kebab-case identifier
  name: "My Domain Name"           # display name in the UI
  description: "Short description of what this domain covers"
  version: "1.0.0"
  icon: "🔧"                       # emoji icon for the UI

# ---- Parameters ----
# Each parameter the domain can validate.
# Keys: key, label, unit, category, required, range (min/max), description
parameters:
  - key: "example_param"
    label: "Example Parameter"
    unit: "dB"
    category: "signal"             # signal | location | flight | power | metadata | other
    required: true                 # must be mapped before pipeline runs?
    range:
      min: -100
      max: 100
    description: "Describe what this parameter represents"

  # - key: "another_param"
  #   label: "Another Parameter"
  #   unit: "meters"
  #   category: "location"
  #   required: false
  #   range:
  #     min: 0
  #     max: 10000
  #   description: "..."

# ---- Presets ----
# Named column mapping presets for known datasets.
# Each preset maps parameter keys -> CSV column names.
presets:
  # example_dataset:
  #   name: "Example Dataset"
  #   description: "Dataset collected from XYZ"
  #   mappings:
  #     example_param: "CSV_Column_Name"
  #     another_param: "Other_Column"

# ---- Consistency Rules ----
# Physics-based cross-parameter relationships to verify.
# Types: "relationship" (A op B = C) or "correlation" (A correlates with B)
consistency_rules:
  # Relationship example: derived = component_a - component_b
  # - id: "snr_check"
  #   name: "SNR Derivation Check"
  #   description: "Verify SNR ≈ Rx Power - Noise Power"
  #   type: "relationship"
  #   formula:
  #     derived_param: "snr"
  #     component_a: "rx_power"
  #     component_b: "noise_power"
  #     operator: "subtract"       # subtract | add | ratio
  #   tolerance_db: 3

  # Correlation example: A should correlate with B
  # - id: "signal_distance"
  #   name: "Signal-Distance Correlation"
  #   description: "RSSI should decrease with distance"
  #   type: "correlation"
  #   correlation:
  #     param_a: "rssi"
  #     param_b: "distance"
  #     expected_direction: "negative"   # positive | negative
  #     min_abs_correlation: 0.3

# ---- Unit Detection ----
# Rules for detecting measurement scale issues.
# Each entry lists conditions to check for a parameter.
unit_detection:
  # - param_key: "rx_power"
  #   expected_scale: "dbm"
  #   rules:
  #     - condition: "all_positive_and_small"    # min > 0 AND max < 10
  #       detected: "linear_watts"
  #       message: "Values are small positive numbers — likely linear watts, needs 10*log10()"
  #     - condition: "very_negative"              # min < -200
  #       detected: "suspicious_offset"
  #       message: "Suspiciously low values — possible offset error"
  #     - condition: "negative_range"             # min < 0
  #       detected: "dbm"
  #       message: "Negative values consistent with dBm scale"

# ---- Reference Models ----
# Propagation or physics models to overlay on measured data.
# Leave empty [] if the domain has no applicable reference models.
reference_models: []
  # - id: "fspl"
  #   name: "Free Space Path Loss"
  #   type: "path_loss"
  #   frequency_ghz: 5.9
  #   equation: "20*log10(d) + 20*log10(f) + 20*log10(4*pi/c)"
  #   color: "#10b981"
  #   dash_pattern: "5 5"

# ---- Readiness Weights ----
# How much each pipeline component contributes to the DT-Readiness score.
# Must sum to 1.0.
readiness_weights:
  range_compliance: 0.25
  cross_param_consistency: 0.25
  no_placeholders: 0.15
  completeness: 0.25
  unit_consistency: 0.10
