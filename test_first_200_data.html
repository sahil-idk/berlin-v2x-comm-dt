        function testData() {
            console.log('Testing embedded data...');

            try {
                console.log('Data length:', embeddedFirst200Data.length);
                console.log('First record:', embeddedFirst200Data[0]);
                
                // Test filtering
                const filtered = embeddedFirst200Data.filter(row => {
                    const sourceLat = parseFloat(row['Latitude_source']);
                    const sourceLon = parseFloat(row['Longitude_source']);
                    const destLat = parseFloat(row['Latitude_destination']);
                    const destLon = parseFloat(row['Longitude_destination']);
                    
                    return !isNaN(sourceLat) && !isNaN(sourceLon) && !isNaN(destLat) && !isNaN(destLon);
                });
                
                console.log('Filtered length:', filtered.length);
                
                document.getElementById('status').textContent = `✅ Data loaded successfully: ${filtered.length} records`;
                document.getElementById('results').innerHTML = `
                    <p>Total records: ${embeddedFirst200Data.length}</p>
                    <p>Valid records: ${filtered.length}</p>
                    <p>First record distance: ${filtered[0].distance}m</p>
                    <p>Source coordinates: ${filtered[0].Latitude_source}, ${filtered[0].Longitude_source}</p>
                    <p>Destination coordinates: ${filtered[0].Latitude_destination}, ${filtered[0].Longitude_destination}</p>
                `;
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('status').textContent = `❌ Error: ${error.message}`;
            }
        }

        document.addEventListener('DOMContentLoaded', testData);
